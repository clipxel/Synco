[package]
name = "synco"
version = "0.0.0"
description = "Synco: sincroniza cámaras y grabadores por el audio"
license = "AGPL-3.0-only"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
serde_json = "1"

[profile.release]
strip = true
lto = true
